<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Something to Do | Bored in NYC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar" aria-label="Main navigation">
      <a class="site-name" href="index.html">Bored in NYC</a>
      <a class="nav-link" href="index.html#hobbies">Explore ideas</a>
    </nav>
  </header>

  <main>
    <h1>Where are we going?</h1>
    <p>Pick a neighborhood. We’ll give you somewhere to start.</p>

    <form id="activity-quiz">
      <fieldset class="quiz-question">
        <legend>Which neighborhood sounds good?</legend>

        <label class="quiz-option">
          <input type="radio" name="neighborhood" value="east-village" required>
          <span>East Village</span>
        </label>

        <label class="quiz-option">
          <input type="radio" name="neighborhood" value="williamsburg" required>
          <span>Williamsburg</span>
        </label>

        <label class="quiz-option">
          <input type="radio" name="neighborhood" value="upper-west-side" required>
          <span>Upper West Side</span>
        </label>

        <label class="quiz-option">
          <input type="radio" name="neighborhood" value="any" required>
          <span>I’m open to any of these</span>
        </label>
      </fieldset>

      <button class="button" type="submit">Show me some ideas →</button>
    </form>

    <p id="results-summary" role="status"></p>
    <div id="activity-results"></div>
  </main>

  <script src="activities.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
